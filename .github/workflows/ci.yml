name: CI

on:
  push:
    branches: [main]
    # Docs and notes never change the build.
    paths-ignore: ['docs/**', '**.md', 'research/**', '.claude/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'research/**', '.claude/**', '.github/ISSUE_TEMPLATE/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Liquid Glass needs the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        # Everything, the app and tests included, in one debug build. The release bundle is built by the
        # release itself (disk image), not here.
        run: swift build --build-tests
      - name: Test
        # shortcut: serial (~3 min); in parallel the run hangs on the 3-core runner, never locally,
        # find the blocking test when CI needs to be faster.
        run: swift test --skip-build --no-parallel
