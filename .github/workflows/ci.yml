name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Liquid Glass needs the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build
      - name: Test
        # shortcut: serial (~2 min); in parallel the run hangs on the 3-core runner, never locally,
        # find the blocking test when CI needs to be faster.
        run: swift test --no-parallel
      - name: Bundle
        run: scripts/bundle.sh release
