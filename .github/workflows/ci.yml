name: CI

on:
  push:
    branches: [main]
    # Docs and notes never change the build.
    paths-ignore: ['docs/**', '**.md', 'research/**', '.claude/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'research/**', '.claude/**', '.github/ISSUE_TEMPLATE/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Two runners side by side: the tests need only Core and the test targets, the app build catches what only
# the app's code breaks. The release bundle is built by the release itself (disk image), not here.
jobs:
  test:
    # Liquid Glass needs the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The C libraries (libjxl, jxrlib, libwebp) take most of a cold build and never change between pushes: the
      # build folder is cached, keyed on their sources and the toolchain. Checkout stamps every file with the time
      # it ran, so their sources get a fixed old date back: the key guarantees they equal the cached build's.
      - name: Toolchain
        run: (xcodebuild -version && swift --version) | tee toolchain.txt
      - uses: actions/cache@v6
        with:
          path: .build
          key: build-test-${{ hashFiles('toolchain.txt', 'Package.swift', 'Package.resolved', 'Sources/CJPEGXL/**', 'Sources/CJPEGXR/**') }}
      - name: C sources as old as the cached build
        run: find Sources/CJPEGXL Sources/CJPEGXR -type f -exec touch -t 200001010000 {} +
      - name: Build tests
        run: swift build --product FeatherviewPackageTests
      - name: Test
        # shortcut: serial (~2 min); in parallel the run hangs on the 3-core runner, never locally,
        # find the blocking test when CI needs to be faster.
        run: swift test --skip-build --no-parallel

  app:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The C libraries (libjxl, jxrlib, libwebp) take most of a cold build and never change between pushes: the
      # build folder is cached, keyed on their sources and the toolchain. Checkout stamps every file with the time
      # it ran, so their sources get a fixed old date back: the key guarantees they equal the cached build's.
      - name: Toolchain
        run: (xcodebuild -version && swift --version) | tee toolchain.txt
      - uses: actions/cache@v6
        with:
          path: .build
          key: build-app-${{ hashFiles('toolchain.txt', 'Package.swift', 'Package.resolved', 'Sources/CJPEGXL/**', 'Sources/CJPEGXR/**') }}
      - name: C sources as old as the cached build
        run: find Sources/CJPEGXL Sources/CJPEGXR -type f -exec touch -t 200001010000 {} +
      - name: Build app, extensions and tools
        run: swift build
