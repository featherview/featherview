name: CI

on:
  push:
    branches: [main]
    # Docs and notes never change the build.
    paths-ignore: ['docs/**', '**.md', 'research/**', '.claude/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'research/**', '.claude/**', '.github/ISSUE_TEMPLATE/**']
  # The sanitizer runs: Mondays, and by hand.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

# Per event too, so a push to main never cancels the sanitizer run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The jobs only check out and build; the token needs nothing else.
permissions:
  contents: read

# Two runners side by side: the tests need only Core and the test targets, the app build catches what only
# the app's code breaks. The release bundle is built by the release itself (disk image), not here.
jobs:
  build:
    name: ${{ matrix.job }}
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    # Liquid Glass needs the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      # Each runner finishes and reports on its own, whatever the other one does.
      fail-fast: false
      matrix:
        include:
          - job: test
            build: swift build --product FeatherviewPackageTests
            test: swift test --skip-build
          - job: app
            build: swift build
    steps:
      - uses: actions/checkout@v7
      # The C libraries (libjxl, jxrlib, libwebp) take most of a cold build and never change between pushes: the
      # build folder is cached, keyed on their sources and the toolchain. Checkout stamps every file with the time
      # it ran, so their sources get a fixed old date back: the key guarantees they equal the cached build's.
      - name: Toolchain
        run: (xcodebuild -version && swift --version) | tee toolchain.txt
      - uses: actions/cache@v6
        with:
          path: .build
          key: build-${{ matrix.job }}-${{ hashFiles('toolchain.txt', 'Package.swift', 'Package.resolved', 'Sources/CJPEGXL/**', 'Sources/CJPEGXR/**') }}
      - name: C sources as old as the cached build
        run: find Sources/CJPEGXL Sources/CJPEGXR -type f -exec touch -t 200001010000 {} +
      - name: Build
        run: ${{ matrix.build }}
      - name: Test
        if: matrix.test
        run: ${{ matrix.test }}

  # The whole suite under AddressSanitizer and ThreadSanitizer (scripts/sanitize.sh). Too slow for every push.
  sanitize:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Sanitizers
        run: scripts/sanitize.sh
