name: CodeQL

on:
  push:
    branches: [main]
    # Docs and notes hold no code to scan.
    paths-ignore: ['docs/**', '**.md', 'research/**', '.claude/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'research/**', '.claude/**', '.github/ISSUE_TEMPLATE/**']
  # Weekly too: new queries find old code.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: ${{ matrix.languages }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift and the vendored C libraries come out of one traced build. No build cache: CodeQL only sees
          # what is compiled while it watches.
          - languages: swift, c-cpp
            runner: macos-26
            build-mode: manual
          - languages: actions, javascript-typescript, python
            runner: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.languages }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build
        if: matrix.build-mode == 'manual'
        run: swift build
      - uses: github/codeql-action/analyze@v4
