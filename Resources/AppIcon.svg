<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Source of AppIcon.icns. Same mark as the website favicon, on the macOS icon grid (824 px tile). -->
  <defs>
    <linearGradient id="tile" x2="0" y2="1"><stop stop-color="#23232c"/><stop offset="1" stop-color="#101015"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc766"/><stop offset="1" stop-color="#ff7a59"/></linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="-8" y="-8" width="80" height="80"><feDropShadow dy="12" stdDeviation="14" flood-opacity=".35"/></filter>
  </defs>
  <g transform="translate(100 100) scale(12.875)" filter="url(#shadow)">
    <rect width="64" height="64" rx="14.4" fill="url(#tile)"/>
    <path d="M46 10C28 14 18 28 16 50l4 2c2-6 5-11 9-15 8-1 14-6 17-14-4 2-8 3-12 3 5-3 10-8 12-16z" fill="url(#mark)"/>
  </g>
</svg>
